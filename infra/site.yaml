AWSTemplateFormatVersion: "2010-09-09"
Description: >
  danielvaz.dev - CloudFront distribution, HTTPS certificate and DNS for the portfolio site root.
  Learn That Song lives under /learnthatsong/. Must be deployed in us-east-1 (CloudFront certificates live there).
  The site bucket and the Route 53 hosted zone already exist and are referenced, not created.

Parameters:
  DomainName:
    Type: String
    Default: danielvaz.dev
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Hosted zone created when the domain was registered in Route 53.
  SiteBucket:
    Type: String
    Default: learn-that-song-s3-site
    Description: Private S3 bucket holding the static site (served only through CloudFront).
  SiteBucketRegion:
    Type: String
    Default: ap-southeast-2

Resources:
  # Wildcard so future projects can use subdomains without a new certificate. One DNS record validates both names.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "*.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "*.${DomainName}"
          HostedZoneId: !Ref HostedZoneId

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: Lets CloudFront read the private site bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Viewer-request router: canonical host, /learnthatsong -> /learnthatsong/, directory URLs -> index.html.
  RouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-router"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirects and index.html rewriting for the static site
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function redirect(status, location) {
          return {
            statusCode: status,
            statusDescription: status === 301 ? 'Moved Permanently' : 'Found',
            headers: { location: { value: location }, 'cache-control': { value: 'max-age=300' } }
          };
        }

        function handler(event) {
          var request = event.request;
          var host = (request.headers.host && request.headers.host.value || '').toLowerCase();
          var uri = request.uri;

          if (host === 'www.${DomainName}') return redirect(301, 'https://${DomainName}' + uri);
          // Placeholder until the portfolio home page exists: send the root to the app.
          if (uri === '/') return redirect(302, 'https://${DomainName}/learnthatsong/');
          if (uri === '/learnthatsong') return redirect(301, 'https://${DomainName}/learnthatsong/');
          if (uri.charAt(uri.length - 1) === '/') request.uri = uri + 'index.html';
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${DomainName} (portfolio and projects)"
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site-s3
            DomainName: !Sub "${SiteBucket}.s3.${SiteBucketRegion}.amazonaws.com"
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b698d30f # Managed-SecurityHeadersPolicy (HSTS, nosniff, frame, referrer)
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RouterFunction.FunctionARN

  Records:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - { Name: !Sub "${DomainName}.",     Type: A,    AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
        - { Name: !Sub "${DomainName}.",     Type: AAAA, AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
        - { Name: !Sub "www.${DomainName}.", Type: A,    AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
        - { Name: !Sub "www.${DomainName}.", Type: AAAA, AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionArn:
    Value: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
